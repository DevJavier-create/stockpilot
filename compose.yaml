services:
  db:
    image: postgres:16-alpine
    container_name: stockpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot_user
      POSTGRES_PASSWORD: stockpilot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - stockpilot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot_user -d stockpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockpilot_data:
